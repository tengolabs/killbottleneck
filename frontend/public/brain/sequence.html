<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sequence</title>
<style>
/* ===== Deluxe look — shared design kit for every brain game (inline this block; keep the names) =====
   Source of the look: "Minesweeper Deluxe" (miny-modely/deluxe, 3. 11. 2026) chosen by Richard 14. 11. 2026.
   Light = :root, dark = :root[data-theme="dark"]. No external URLs, no web fonts (system stack only). */
:root {
  --bg-gradient: radial-gradient(circle at 50% 0%, #f5f7fc 0%, #d3dae8 100%);
  --panel: rgba(255,255,255,.78); --panel-solid:#ffffff; --line: rgba(30,41,59,.14);
  --panel-shadow: 0 20px 40px rgba(30,41,59,.16), 0 0 0 1px rgba(30,41,59,.06);
  --text:#0f172a; --muted:#5b6578;
  --tile: linear-gradient(145deg,#ffffff,#dde4ef); --tile-border:#aab6ca; --tile-hover: linear-gradient(145deg,#ffffff,#eef2f8);
  --tile-down:#cbd4e1; --tile-down-border:#b3bfd0; --tile-shine: rgba(255,255,255,.95);
  --well: rgba(30,41,59,.07);                 /* darker inset area (board wrapper, status panel) */
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-text:#ffffff; --accent-glow: rgba(99,102,241,.35);
  --ok:#10b981; --bad:#ef4444; --warn:#f59e0b; --info:#06b6d4; --pink:#ec4899; --violet:#8b5cf6;
  --n1:#3b82f6; --n2:#10b981; --n3:#ef4444; --n4:#8b5cf6; --n5:#f59e0b; --n6:#06b6d4; --n7:#ec4899; --n8:#64748b;
  --radius:18px; --radius-s:10px;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg-gradient: radial-gradient(circle at 50% 0%, #1e1e38 0%, #0d0e1a 100%);
  --panel: rgba(26,27,46,.75); --panel-solid:#1a1b2e; --line: rgba(255,255,255,.1);
  --panel-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
  --text:#f0f3f8; --muted:#8c93a8;
  --tile: linear-gradient(145deg,#2a2d48,#20233b); --tile-border:#3b3f63; --tile-hover: linear-gradient(145deg,#35395c,#272a47);
  --tile-down:#141524; --tile-down-border:#1f2136; --tile-shine: rgba(255,255,255,.1);
  --well: rgba(0,0,0,.25);
  --accent:#6366f1; --accent-hover:#4f46e5; --accent-text:#ffffff;
  color-scheme: dark;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--bg-gradient) fixed; color:var(--text); overflow:hidden; display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent;
       user-select:none; -webkit-user-select:none; }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }

/* glowing background blobs: <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div> as the first child of body */
.blobs { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.blobs i { position:absolute; border-radius:50%; filter:blur(70px); opacity:.34; animation: blobfloat 14s infinite alternate ease-in-out; }
:root[data-theme="dark"] .blobs i { opacity:.22; }
.blobs i:nth-child(1) { width:45vmax; height:45vmax; background:#6366f1; top:-15vmax; left:5%; }
.blobs i:nth-child(2) { width:50vmax; height:50vmax; background:#ec4899; bottom:-20vmax; right:0; animation-duration:18s; }
.blobs i:nth-child(3) { width:35vmax; height:35vmax; background:#06b6d4; top:40%; left:55%; animation-duration:12s; }
@keyframes blobfloat { to { transform: translateY(30px) scale(1.08); } }

/* glass card = the game panel; sits above the blobs */
.glass { position:relative; z-index:1; background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
         border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--panel-shadow); }
#app { height:calc(100% - 16px); margin:8px; display:flex; flex-direction:column; gap:8px; padding:10px 12px; min-height:0; }
@media (max-height:360px) { #app { height:calc(100% - 8px); margin:4px; padding:6px 8px; gap:6px; } }

/* status panel (HUD) with digital displays */
.status { display:flex; align-items:center; justify-content:space-between; gap:8px; flex:none;
          background:var(--well); border:1px solid var(--line); border-radius:14px; padding:6px 12px; }
.display { display:flex; flex-direction:column; align-items:center; min-width:56px; }
.display .label { font-size:.62rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.digits { font-family:var(--mono); font-size:1.25rem; font-weight:700; color:#ef4444; text-shadow:0 0 10px rgba(239,68,68,.5);
          background:#000; padding:1px 8px; border-radius:8px; letter-spacing:2px; border:1px solid rgba(239,68,68,.2);
          font-variant-numeric:tabular-nums; line-height:1.3; }
.digits.green { color:#10b981; text-shadow:0 0 10px rgba(16,185,129,.5); border-color:rgba(16,185,129,.25); }
.digits.blue { color:#60a5fa; text-shadow:0 0 10px rgba(96,165,250,.5); border-color:rgba(96,165,250,.25); }
.pill { background:var(--well); border:1px solid var(--line); border-radius:999px; padding:3px 12px; font-size:.78rem; color:var(--muted); white-space:nowrap; }
.pill strong { color:var(--ok); }
.badge { font-size:.62rem; font-weight:700; text-transform:uppercase; background:linear-gradient(135deg,#f59e0b,#ec4899); color:#fff;
         padding:2px 8px; border-radius:999px; letter-spacing:.5px; }

/* 3D tiles (cells, cards, keys) */
.tile { background:var(--tile); border:1px solid var(--tile-border); border-radius:8px; color:var(--text);
        box-shadow: inset 0 1px 0 var(--tile-shine), 0 2px 4px rgba(0,0,0,.2); transition: background .1s, transform .1s, box-shadow .1s; }
.tile:hover { background:var(--tile-hover); transform:translateY(-1px); }
.tile:active { transform:translateY(1px) scale(.97); }
.tile.down { background:var(--tile-down); border-color:var(--tile-down-border); box-shadow: inset 0 2px 4px rgba(0,0,0,.4); transform:none; }
.well { background:var(--well); border:1px solid var(--line); border-radius:14px; padding:8px; }

/* buttons */
.btn { background:var(--accent); color:var(--accent-text); border:0; border-radius:var(--radius-s); padding:9px 18px; font-weight:700;
       box-shadow:0 4px 14px var(--accent-glow); transition: background .2s, transform .15s; }
.btn:hover { background:var(--accent-hover); transform:translateY(-1px); }
.btn:active { transform:translateY(1px); }
.btn.ghost { background:var(--well); color:var(--text); box-shadow:none; border:1px solid var(--line); }
.icon-btn { width:34px; height:34px; border-radius:10px; background:var(--well); border:1px solid var(--line); display:inline-flex;
            align-items:center; justify-content:center; font-size:1rem; transition: background .2s, transform .2s; flex:none; }
.icon-btn:hover { transform:translateY(-1px); background:rgba(127,127,127,.18); }
.icon-btn[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:transparent; }

/* overlays (start / end / pause) — centred glass card */
.overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:12px; z-index:20;
           background:rgba(0,0,0,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:inherit; animation: fadeIn .2s ease; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:16px 20px; max-width:360px; width:100%;
        text-align:center; box-shadow:var(--panel-shadow); color:var(--text); }
.card h2 { margin:0 0 6px; font-size:1.15rem; font-weight:800; letter-spacing:-.3px; }
.card p { margin:0 0 12px; color:var(--muted); font-size:.85rem; line-height:1.4; }
.card .big { font-family:var(--mono); font-size:2rem; font-weight:800; color:var(--accent); margin:2px 0 8px; font-variant-numeric:tabular-nums; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
@keyframes popIn { 0% { transform:scale(.85); opacity:.6; } 100% { transform:scale(1); opacity:1; } }
@keyframes shake { 0%,100% { transform:translate(0,0); } 25% { transform:translate(-4px,2px); } 50% { transform:translate(4px,-2px); } 75% { transform:translate(-2px,-2px); } }
#confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }
#selftest { position:fixed; left:0; bottom:0; z-index:99; font:11px var(--mono); color:#fff; background:#000; padding:2px 6px; }
@media (prefers-reduced-motion: reduce) { .blobs i, .overlay, .tile, .btn { animation:none !important; transition:none !important; } }
/* in-game level choice (games with more than one level): <div class="levels" role="group" id="levels"></div> filled with
   <button class="lvl" type="button" data-level="N" aria-pressed="true|false"><b>Name</b><small>info</small></button> */
.levels { display:flex; gap:6px; flex:none; flex-wrap:wrap; }
.lvl { flex:1 1 72px; min-width:0; background:var(--well); border:1px solid var(--line); border-radius:12px; padding:5px 8px; display:flex; flex-direction:column;
       align-items:center; gap:1px; transition: background .2s; }
.lvl b { font-weight:700; font-size:.85rem; white-space:nowrap; } .lvl small { font-size:.66rem; color:var(--muted); white-space:nowrap; }
.lvl:hover { background:rgba(127,127,127,.14); }
.lvl[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 4px 14px var(--accent-glow); }
.lvl[aria-pressed="true"] small { color:rgba(255,255,255,.8); }
@media (max-height:360px) { .lvl small { display:none; } .lvl { padding:3px 6px; } }
/* "How to play" (added 15. 11. after Richard's klik-test — the word game had no explanation at all): a labelled button in the
   .status HUD <button class="icon-btn help" id="helpBtn" type="button">❓<span id="helpLbl"></span></button> opens
   <div class="overlay" id="helpOverlay" hidden><div class="card rules"><button class="close" id="helpClose" type="button"
   aria-label="close">&times;</button><h2 id="rulesTitle"></h2><div class="modal-body"><ul id="rulesList"></ul></div></div></div>
   filled by bindHelp(T) from STR keys `help`, `rulesTitle`, `rules` (array of short HTML items, <b>…</b> for the keyword). */
.icon-btn.help { width:auto; padding:0 10px; gap:6px; font-size:.78rem; font-weight:700; color:var(--text); }
.icon-btn.help span { white-space:nowrap; }
@media (max-width:479px), (max-height:360px) { .icon-btn.help span { display:none; } .icon-btn.help { padding:0; width:34px; } }
.card.rules { position:relative; max-width:440px; max-height:calc(100% - 8px); display:flex; flex-direction:column; }
.card.rules .modal-body { overflow:auto; min-height:0; }
.modal-body ul { margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:.86rem; line-height:1.4; text-align:left; }
.modal-body li b { color:var(--text); }
.card .close { position:absolute; right:10px; top:6px; background:none; border:0; font-size:1.4rem; color:var(--muted); cursor:pointer; }
/* example tiles inside the rules (word game): <span class="ex"><i class="hit">S</i><i class="near">T</i><i class="miss">A</i></span> */
.ex { display:inline-flex; gap:3px; vertical-align:middle; margin:0 2px; }
.ex i { font-style:normal; font-weight:800; font-size:.8rem; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
        border-radius:5px; background:var(--tile); border:1px solid var(--tile-border); color:var(--text); text-transform:uppercase; }
.ex i.hit { background:var(--ok); border-color:var(--ok); color:#fff; } .ex i.near { background:var(--warn); border-color:var(--warn); color:#fff; }
.ex i.miss { background:var(--tile-down); border-color:var(--tile-down-border); color:var(--muted); }
/* ===== Sequence — game-specific styles (kit variables only) ===== */
.status { justify-content:center; gap:10px; }
.msgrow { flex:none; display:flex; align-items:center; justify-content:center; gap:10px; min-height:34px; min-width:0; }
.msgrow .pill { white-space:normal; text-align:center; font-size:.85rem; font-weight:700; color:var(--text); min-width:0; line-height:1.3;
                transition: color .15s, border-color .15s; }
.msgrow .pill.watch { color:var(--accent); border-color:var(--accent); }
:root[data-theme="dark"] .msgrow .pill.watch { color:#a5b4fc; border-color:#6366f1; }
.msgrow .pill.input { color:var(--ok); border-color:var(--ok); }
.msgrow .pill.wrong { color:var(--bad); border-color:var(--bad); }
.msgrow .btn { padding:6px 18px; flex:none; }
#board-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:4px; min-height:0; }
#board { display:grid; gap:var(--gap,10px); }
.pad { --c:#888; position:relative; padding:0; margin:0; border-radius:16px; cursor:pointer; touch-action:manipulation; outline-offset:3px;
       --pad-bg: linear-gradient(145deg, color-mix(in srgb, var(--c) 62%, var(--panel-solid)), color-mix(in srgb, var(--c) 38%, var(--panel-solid)));
       background:var(--pad-bg); border-color:color-mix(in srgb, var(--c) 55%, var(--tile-border));
       box-shadow: inset 0 1px 0 var(--tile-shine), inset 0 -3px 0 rgba(0,0,0,.16), 0 3px 6px rgba(0,0,0,.22);
       transition: background .12s, box-shadow .12s, transform .12s, filter .12s; }
.pad:hover { background:var(--pad-bg); filter:brightness(1.07); }
.pad small { position:absolute; left:8px; top:5px; font:700 11px var(--mono); color:rgba(15,23,42,.8); text-shadow:0 0 3px rgba(255,255,255,.9); pointer-events:none; }
:root[data-theme="dark"] .pad small { color:rgba(255,255,255,.95); text-shadow:0 0 3px rgba(0,0,0,.75); }
.pad.lit, .pad.lit:hover { --pad-bg: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 72%);
       border-color:color-mix(in srgb, var(--c) 40%, #fff); filter:none; transform:scale(1.04); z-index:1;
       box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 2px color-mix(in srgb, var(--c) 55%, #fff), 0 0 28px 6px var(--c); }
.pad.wrong { animation: shake .35s; box-shadow: 0 0 0 3px var(--bad), 0 0 18px var(--bad); }
.pad.hint { animation: hintPulse .45s ease-in-out infinite alternate; }
@keyframes hintPulse { to { box-shadow: 0 0 0 4px #fff, 0 0 38px 12px var(--c); } }
#board.locked .pad { cursor:default; }
#board.locked .pad:not(.lit):hover { filter:none; transform:none; }
.dot { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px; background:var(--c); color:#fff;
       font:700 11px var(--mono); font-style:normal; text-shadow:0 0 2px rgba(0,0,0,.8); vertical-align:middle; box-shadow:0 0 8px var(--c); }
#overlay { display:none; }
#overlay.show { display:flex; }
body.paused #board, body.paused .msgrow { opacity:.35; pointer-events:none; }
#pause-tag { display:none; cursor:pointer; background:rgba(0,0,0,.2); backdrop-filter:none; -webkit-backdrop-filter:none; }
body.paused #pause-tag { display:flex; }
#pause-tag .card { width:auto; padding:10px 24px; display:flex; flex-direction:column; gap:2px; }
#pause-text { font-size:1.2rem; font-weight:800; }
#pause-hint { font-size:.78rem; color:var(--muted); }
@media (max-width:380px) { .status { gap:6px; padding:6px 8px; } .display { min-width:0; } .digits { font-size:1.05rem; letter-spacing:1px; padding:1px 6px; } }
@media (max-height:360px) { .status { padding:4px 10px; } .digits { font-size:1.05rem; } .display .label { font-size:.56rem; }
  .msgrow { min-height:28px; } .msgrow .pill { font-size:.78rem; padding:2px 10px; } .msgrow .btn { padding:4px 14px; }
  .card .big { font-size:1.5rem; margin:0 0 4px; } .card p { margin-bottom:8px; } }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app" class="glass">
  <div id="hud" class="status">
    <div class="display"><span class="label" id="l-len"></span><span class="digits" id="len">0</span></div>
    <div class="display"><span class="label" id="l-best"></span><span class="digits green" id="best">0</span></div>
    <button class="icon-btn help" id="helpBtn" type="button">❓<span id="helpLbl"></span></button>
    <button class="icon-btn" id="soundBtn" type="button"></button>
  </div>
  <div class="levels" id="levels" role="group"></div>
  <div class="msgrow"><span class="pill" id="msg" aria-live="polite"></span><button class="btn" id="startBtn" type="button"></button></div>
  <div id="board-wrap"><div id="board" role="group"></div></div>
  <div id="pause-tag" class="overlay" role="button" tabindex="0"><div class="card"><span id="pause-text"></span><small id="pause-hint"></small></div></div>
  <div id="overlay" class="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h2 id="ov-title"></h2>
      <div class="big" id="ov-score"></div>
      <p id="ov-text"></p>
      <button class="btn" id="ov-again" type="button"></button>
    </div>
  </div>
  <div class="overlay" id="helpOverlay" hidden><div class="card rules"><button class="close" id="helpClose" type="button" aria-label="close">&times;</button><h2 id="rulesTitle"></h2><div class="modal-body"><ul id="rulesList"></ul></div></div></div>
</div>
<canvas id="confetti"></canvas>
<div id="selftest" hidden></div>
<script>
'use strict';
// ===== Deluxe kit — shared sound + confetti for every brain game (inline this block; keep the names) =====
// Sounds come from "NEON::MINES" (miny-modely/cyber), chosen by Richard 14. 11. 2026: short square-wave tones,
// Web Audio only, no files. `sfx.enabled` is stored in localStorage (key: brain-sound); the word games also keep their deck there (words.js).
const sfx = {
  ctx: null,
  enabled: (() => { try { return localStorage.getItem('brain-sound') !== '0'; } catch { return true; } })(),
  ac() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  set(on) { this.enabled = !!on; try { localStorage.setItem('brain-sound', on ? '1' : '0'); } catch { /* private mode */ } },
  tone(f, d = 0.08, type = 'square', g = 0.04, delay = 0) {
    if (!this.enabled) return;
    const c = this.ac(); if (!c) return;
    const o = c.createOscillator(), v = c.createGain();
    o.type = type; o.frequency.value = f;
    const t0 = c.currentTime + delay;
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.linearRampToValueAtTime(g, t0 + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(v).connect(c.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  },
  noise(d = 0.4, g = 0.15) {
    if (!this.enabled) return;
    const c = this.ac(); if (!c) return;
    const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 800;
    const v = c.createGain(); v.gain.value = g;
    src.connect(fl).connect(v).connect(c.destination); src.start();
  },
  // vocabulary shared by all games
  click() { this.tone(920, 0.05, 'square', 0.02); },          // reveal / flip / key press
  flag()  { this.tone(430, 0.07, 'square', 0.03); },          // secondary action (flag, note)
  ok()    { this.tone(660, 0.06, 'square', 0.03); this.tone(990, 0.08, 'square', 0.03, 0.06); }, // correct answer
  bad()   { this.tone(180, 0.14, 'sawtooth', 0.05); },        // wrong answer
  boom()  { this.noise(0.5, 0.2); this.tone(65, 0.45, 'sawtooth', 0.12); },                     // mine hit / game lost
  win()   { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.13, 'square', 0.04, i * 0.11)); },
};

// Confetti burst on a won round (canvas#confetti, fixed, pointer-events:none). Honour reduced motion.
function confetti() {
  const canvas = document.getElementById('confetti');
  if (!canvas || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6'];
  const ps = Array.from({ length: 110 }, () => ({ x: canvas.width / 2, y: canvas.height / 2, vx: (Math.random() - .5) * 18, vy: (Math.random() - .7) * 20,
    size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], a: 1, rot: Math.random() * 360, rs: (Math.random() - .5) * 10 }));
  (function step() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += .4; p.rot += p.rs; p.a -= .012;
      if (p.a <= 0) continue;
      alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180); ctx.globalAlpha = p.a; ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore();
    }
    if (alive) requestAnimationFrame(step); else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}

// Sound toggle button: <button class="icon-btn" id="soundBtn" type="button"></button>; the hub's `mute` action calls sfx.set(false) + syncSound().
function syncSound() { const b = document.getElementById('soundBtn'); if (!b) return; b.textContent = sfx.enabled ? '🔊' : '🔇'; b.setAttribute('aria-pressed', String(!sfx.enabled)); }

// Theme + level plumbing shared by all games (added 14. 11. evening, Richard's klik-test):
// - the hub sends { action: 'theme', theme: 'light'|'dark' } when the app theme or skin changes → recolour WITHOUT restarting the game
// - the player picks the level inside the game: when embedded, the game only reports it ({ event: 'level' }) and the hub reloads
//   the game at that level (the hub is the source of truth for the round on the server); standalone, the game restarts itself.
function applyTheme(theme) { if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; }
// Builds the level buttons; `names` = STR.levels (array of display names), `infos` = optional array of short hints, `current` = 1-based.
function buildLevels(names, infos, current, onPick) {
  const box = document.getElementById('levels'); if (!box) return;
  box.innerHTML = '';
  names.forEach((name, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lvl'; b.dataset.level = i + 1; b.setAttribute('aria-pressed', String(i + 1 === current));
    b.innerHTML = `<b>${name}</b>${infos && infos[i] ? `<small>${infos[i]}</small>` : ''}`;
    b.addEventListener('click', () => { if (i + 1 !== current) onPick(i + 1); });
    box.appendChild(b);
  });
}
// "How to play" modal (added 15. 11.): wires #helpBtn / #helpOverlay / #helpClose and fills the texts from STR
// (`help` = button label, `rulesTitle`, `rules` = array of short HTML items). Escape closes it; a click on the backdrop too.
function bindHelp(T) {
  const btn = document.getElementById('helpBtn'), ov = document.getElementById('helpOverlay'); if (!btn || !ov) return;
  const lbl = document.getElementById('helpLbl'); if (lbl) lbl.textContent = T.help; btn.title = T.help; btn.setAttribute('aria-label', T.help);
  document.getElementById('rulesTitle').textContent = T.rulesTitle;
  document.getElementById('rulesList').innerHTML = T.rules.map((r) => `<li>${r}</li>`).join('');
  const open = () => { ov.hidden = false; btn.setAttribute('aria-expanded', 'true'); };
  const close = () => { ov.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', () => (ov.hidden ? open() : close()));
  document.getElementById('helpClose').addEventListener('click', close);
  ov.addEventListener('click', (ev) => { if (ev.target === ov) close(); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !ov.hidden) { close(); ev.stopPropagation(); } }, true);
}
// ---------- i18n ----------

        yourTurn: (i, n) => `Your turn · ${i}/${n}`, correct: 'Correct! One more step.',

        rightWas: (d) => `The right pad was ${d}.`, pad: 'Pad', board: 'Coloured pads', again: 'Play again', paused: 'Paused',
        resumeHint: 'Tap to continue', sound: 'Sound',
        levels: ['Easy', 'Medium', 'Hard'], levelInfos: ['4 pads', '6 pads', '9 pads'], levelsAria: 'Difficulty',
        help: 'How to play', rulesTitle: 'How to play', rules: [
          '<b>Goal:</b> remember the longest possible sequence of lit pads and repeat it. Every pad has its own colour and its own tone.',
          '<b>Watch:</b> after Start the game lights the pads one by one ("Watch…"). You cannot tap the pads while it plays.',

          '<b>Keyboard:</b> keys 1–9 match the pads row by row (the number in the corner of each pad), Enter starts a round.'] },
};
const GAME_ID = 'sequence';
const LEVELS = { 1: { pads: 4 }, 2: { pads: 6 }, 3: { pads: 9 } };
const START_LEN = 2;
// Pad colours: Okabe–Ito based (told apart by most kinds of colour blindness), the number label helps the rest.
const PAD_COLORS = ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00', '#F0E442', '#8B5CF6', '#94A3B8'];
// Pad tones: C major pentatonic (C5 D5 E5 G5 A5 C6 D6 E6 G6) — any order of them sounds pleasant.
const PAD_TONES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98];

// ---------- pure logic (covered by the self-test) ----------
// Seeded PRNG (LCG) for repeatable tests; the game itself uses Math.random.
function makeRng(seed) { let s = (seed >>> 0) || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
// Returns a NEW sequence: the old one unchanged plus one random pad 0..pads-1.
function extendSeq(seq, pads, rnd = Math.random) { return seq.concat(Math.floor(rnd() * pads)); }
function makeSeq(len, pads, rnd = Math.random) { let s = []; while (s.length < len) s = extendSeq(s, pads, rnd); return s; }
// 'wrong' as soon as a tap differs, 'correct' when the whole sequence was repeated, otherwise 'incomplete'.
function checkInput(seq, input) {
  for (let i = 0; i < input.length; i++) if (i >= seq.length || input[i] !== seq[i]) return 'wrong';
  return input.length === seq.length ? 'correct' : 'incomplete';
}
// Score of a round that ended with a mistake on a sequence of `failedLen` steps = the longest sequence repeated correctly.
function scoreFor(failedLen) { return failedLen > START_LEN ? failedLen - 1 : 0; }
// Playback speed: how long a pad stays lit and the pause after it (ms); faster with length, never below the floor.
const TIMING_FLOOR = { on: 260, gap: 100 };
function stepTiming(len) {
  const k = Math.max(0, len - START_LEN);
  return { on: Math.max(TIMING_FLOOR.on, 560 - 28 * k), gap: Math.max(TIMING_FLOOR.gap, 200 - 10 * k) };
}
// Grid of pads for a level; the 6-pad level turns with the available area (3×2 wide, 2×3 tall).
function padLayout(level, W = 1, H = 1) {
  const n = LEVELS[level].pads;
  if (n === 4) return { cols: 2, rows: 2 };
  if (n === 9) return { cols: 3, rows: 3 };
  return W >= H ? { cols: 3, rows: 2 } : { cols: 2, rows: 3 };
}
// Keys 1–9 → pad index in reading order (-1 = not a pad on this level).
function keyToPad(key, pads) { return /^[1-9]$/.test(key) && +key <= pads ? +key - 1 : -1; }

// ---------- params ----------
const params = new URLSearchParams(location.search);
const embed = params.get('embed') === '1';
const lang = params.get('lang') === 'cs' ? 'cs' : 'en';
const T = STR[lang];
const level = LEVELS[params.get('level')] ? +params.get('level') : 1;
const theme = params.get('theme');
document.documentElement.lang = lang;
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

// Hub origin; `file://` pages report origin "null", which postMessage rejects — fall back to "*" there.
const HUB_ORIGIN = location.origin === 'null' ? '*' : location.origin;
function post(msg) { if (embed) window.parent.postMessage(msg, HUB_ORIGIN); }

// ---------- game state ----------
// phase: idle (before Start) → watch (playback, input locked) → input → next (correct, waiting for the longer playback)
//        → … → reveal (mistake shown) → over
const S = { level, pads: 4, seq: [], input: [], phase: 'idle', score: 0, best: 0, expected: -1, startAt: 0, pauseAt: 0,
            paused: false, finished: false, timers: [], padEls: [] };
const $ = (id) => document.getElementById(id);
function later(fn, ms) { S.timers.push(setTimeout(fn, ms)); }
function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

function newGame(lv) {
  if (LEVELS[lv]) S.level = +lv;
  clearTimers();
  Object.assign(S, { pads: LEVELS[S.level].pads, seq: [], input: [], phase: 'idle', score: 0, expected: -1, startAt: 0, pauseAt: 0,
                     finished: false, paused: false });
  document.body.classList.remove('paused');
  $('overlay').classList.remove('show');
  renderBoard();
  updateHud();
  setMsg('idle');
  paintLevels(); // before layout(): the selector takes its height first, the board gets what is left
  layout();
}

// Level choice inside the game: embedded → the hub reloads the game at that level (?level=n); standalone → restart here.
function pickLevel(n) { if (embed) post({ type: 'kb-brain', event: 'level', game: GAME_ID, level: n }); else newGame(n); }
function paintLevels() { buildLevels(T.levels, T.levelInfos, S.level, pickLevel); }

function renderBoard() {
  const board = $('board');
  board.innerHTML = '';
  S.padEls = Array.from({ length: S.pads }, (_, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tile pad'; b.style.setProperty('--c', PAD_COLORS[i]);
    b.setAttribute('aria-label', `${T.pad} ${i + 1}`);
    b.innerHTML = `<small>${i + 1}</small>`;
    b.addEventListener('click', () => press(i));
    board.appendChild(b);
    return b;
  });
  lockBoard(true);
}
function lockBoard(on) { $('board').classList.toggle('locked', on); }
function light(p, on) { const el = S.padEls[p]; if (el) el.classList.toggle('lit', on); }
function unlightAll() { S.padEls.forEach((el) => el.classList.remove('lit')); }
function flash(p, ms) {
  light(p, true);
  sfx.tone(PAD_TONES[p], Math.max(0.12, (ms / 1000) * 0.9), 'triangle', 0.09); // silent when sound is off — colours still play
  later(() => light(p, false), ms);
}
function dot(p) { return `<i class="dot" style="--c:${PAD_COLORS[p]}">${p + 1}</i>`; }

function setMsg(kind, arg) {
  const m = $('msg');
  m.className = 'pill' + (kind === 'watch' ? ' watch' : kind === 'input' || kind === 'correct' ? ' input' : kind === 'wrong' ? ' wrong' : '');
  m.textContent = kind === 'idle' ? T.idle : kind === 'watch' ? T.watch : kind === 'input' ? T.yourTurn(S.input.length, S.seq.length)
    : kind === 'correct' ? T.correct : kind === 'wrong' ? T.wrong(arg + 1) : '';
  $('startBtn').hidden = kind !== 'idle';
}

function updateHud() { $('len').textContent = S.seq.length; $('best').textContent = S.best; }

function start() {
  if (S.paused || S.finished || S.phase !== 'idle') return;
  sfx.click();
  S.seq = makeSeq(START_LEN, S.pads);
  S.startAt = Date.now(); // durationMs runs from the first playback
  playSequence();
}

// Plays the whole current sequence from its start; the input is locked until it ends.
function playSequence() {
  clearTimers(); unlightAll();
  S.phase = 'watch'; S.input = [];
  lockBoard(true); setMsg('watch'); updateHud();
  const { on, gap } = stepTiming(S.seq.length);
  const lead = 550;
  S.seq.forEach((p, i) => later(() => flash(p, on), lead + i * (on + gap)));
  later(() => { S.phase = 'input'; lockBoard(false); setMsg('input'); }, lead + S.seq.length * (on + gap) - gap + 40);
}

function press(p) {
  if (S.paused || S.finished || S.phase !== 'input' || p < 0 || p >= S.pads) return;
  S.input.push(p);
  const r = checkInput(S.seq, S.input);
  if (r === 'wrong') { mistake(p); return; }
  flash(p, 230); // the pad's own tone is the tap sound
  if (r === 'correct') {
    S.score = S.seq.length; S.best = Math.max(S.best, S.score);
    S.seq = extendSeq(S.seq, S.pads); // the old sequence stays, one new step at the end
    S.phase = 'next'; lockBoard(true); setMsg('correct');
    later(() => sfx.ok(), 200);
    later(() => playSequence(), 1000);
    updateHud();
  } else setMsg('input');
}

function mistake(p) {
  S.phase = 'reveal'; lockBoard(true);
  S.expected = S.seq[S.input.length - 1];
  sfx.bad();
  S.padEls[p].classList.add('wrong');
  S.padEls[S.expected].classList.add('lit', 'hint');
  setMsg('wrong', S.expected);
  later(() => finish({ won: true }), 1400);
}

// A finished sequence round is always "won" (like the timed games); the score says how good it was.
function finish({ won }) {
  if (S.finished) return;
  S.finished = true;
  clearTimers();
  S.phase = 'over'; lockBoard(true);
  const end = S.paused && S.pauseAt ? S.pauseAt : Date.now();
  const durationMs = S.startAt ? Math.max(0, end - S.startAt) : 0;
  if (S.paused) { S.paused = false; S.pauseAt = 0; document.body.classList.remove('paused'); }
  const score = scoreFor(S.seq.length); // = the longest sequence repeated before this one
  S.best = Math.max(S.best, score); updateHud();
  post({ type: 'kb-brain', event: 'result', game: GAME_ID, level: S.level, won: !!won, score, durationMs });
  $('ov-title').textContent = T.over;
  $('ov-score').textContent = score;
  $('ov-text').innerHTML = T.summary(score) + (S.expected >= 0 ? '<br>' + T.rightWas(dot(S.expected)) : '');
  $('overlay').classList.add('show');
  $('ov-again').focus({ preventScroll: true });
  if (won && score > 0) { sfx.win(); confetti(); }
}

// Fit the pads into the available area as large squares.
function layout() {
  const wrap = $('board-wrap');
  const W = wrap.clientWidth - 8, H = wrap.clientHeight - 8; // wrapper padding 4px each side
  if (W <= 0 || H <= 0) return;
  const { cols, rows } = padLayout(S.level, W, H);
  const gap = Math.max(6, Math.min(16, Math.round(Math.min(W, H) / 30)));
  const size = Math.max(24, Math.floor(Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows, 200)));
  const board = $('board');
  board.style.setProperty('--gap', gap + 'px');
  board.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  board.style.gridAutoRows = `${size}px`;
}

// Pause stops the playback and every timer; resume replays the current sequence from its start.
function setPaused(p) {
  if (p === S.paused || (p && S.finished)) return;
  S.paused = p;
  document.body.classList.toggle('paused', p);
  if (p) {
    if (S.startAt) S.pauseAt = Date.now();
    clearTimers(); unlightAll();
    return;
  }
  if (S.pauseAt) { S.startAt += Date.now() - S.pauseAt; S.pauseAt = 0; }
  if (S.phase === 'watch' || S.phase === 'input' || S.phase === 'next') playSequence();
  else if (S.phase === 'reveal') finish({ won: true });
}

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || (e.source !== window.parent && e.source !== window) || !e.data || e.data.type !== 'kb-brain') return;
  switch (e.data.action) {
    case 'pause': setPaused(true); break;
    case 'resume': setPaused(false); break;
    case 'mute': sfx.set(false); syncSound(); break;
    case 'theme': applyTheme(e.data.theme); break;
    case 'new': newGame(S.level); break;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
window.addEventListener('resize', layout);
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || !$('helpOverlay').hidden) return;
  if (S.paused) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setPaused(false); } return; }
  const p = keyToPad(ev.key, S.pads);
  if (p >= 0) { ev.preventDefault(); press(p); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && S.phase === 'idle' && !(ev.target instanceof HTMLButtonElement)) { ev.preventDefault(); start(); }
});

// ---------- selftest ----------
function brainSelftest() {
  const fails = [];
  const rnd = makeRng(20261116);
  for (const lv of [1, 2, 3]) {
    const n = LEVELS[lv].pads;
    let seq = makeSeq(START_LEN, n, rnd);
    if (seq.length !== START_LEN) fails.push(`level ${lv}: start length ${seq.length}`);
    const seen = new Set(seq);
    for (let k = 0; k < 80; k++) {
      const before = seq.slice();
      const next = extendSeq(seq, n, rnd);
      if (next.length !== seq.length + 1) fails.push(`level ${lv}: extend added ${next.length - seq.length} steps`);
      if (seq.join() !== before.join()) fails.push(`level ${lv}: extend mutated the old sequence`);
      if (before.some((p, i) => next[i] !== p)) fails.push(`level ${lv}: prefix not kept`);
      const last = next[next.length - 1];
      if (!Number.isInteger(last) || last < 0 || last >= n) fails.push(`level ${lv}: pad ${last} out of range`);
      seen.add(last); seq = next;
    }
    if (seen.size !== n) fails.push(`level ${lv}: only ${seen.size}/${n} pads used in 80 steps`);
    for (const [W, H] of [[800, 300], [300, 800], [400, 400]]) {
      const { cols, rows } = padLayout(lv, W, H);
      if (cols * rows !== n) fails.push(`level ${lv}: layout ${cols}×${rows} for ${n} pads`);
    }
    if (n > PAD_COLORS.length || n > PAD_TONES.length) fails.push(`level ${lv}: not enough colours/tones`);
  }
  if (padLayout(2, 800, 300).cols !== 3 || padLayout(2, 300, 800).cols !== 2) fails.push('level 2 layout does not turn with the aspect');
  if (makeSeq(12, 9, makeRng(7)).join() !== makeSeq(12, 9, makeRng(7)).join()) fails.push('seeded generator not repeatable');
  if (new Set(PAD_COLORS.map((c) => c.toLowerCase())).size !== PAD_COLORS.length) fails.push('pad colours not distinct');
  if (PAD_TONES.some((f, i) => i && f <= PAD_TONES[i - 1])) fails.push('pad tones not ascending');
  // input checker
  const cases = [[[1, 2, 3], [], 'incomplete'], [[1, 2, 3], [1, 2], 'incomplete'], [[1, 2, 3], [1, 2, 3], 'correct'],
                 [[1, 2, 3], [1, 3], 'wrong'], [[1, 2, 3], [2], 'wrong'], [[1, 2], [1, 2, 0], 'wrong'], [[0, 0], [0, 0], 'correct']];
  for (const [seq, inp, want] of cases) { const got = checkInput(seq, inp); if (got !== want) fails.push(`checkInput(${seq}|${inp}) = ${got}, expected ${want}`); }
  // scoring + win/lose: a player who repeats k sequences and then errs scores the longest repeated length (0 when none)
  if (scoreFor(START_LEN) !== 0 || scoreFor(START_LEN + 1) !== START_LEN || scoreFor(9) !== 8) fails.push('scoreFor');
  for (let k = 0; k <= 6; k++) {
    const r = makeRng(100 + k);
    let seq = makeSeq(START_LEN, 6, r), score = 0, ended = false, round = 0;
    while (!ended && round < 50) {
      const input = [];
      for (let i = 0; i < seq.length; i++) {
        input.push(round === k && i === seq.length - 1 ? (seq[i] + 1) % 6 : seq[i]);
        const res = checkInput(seq, input);
        if (res === 'wrong') { ended = true; if (scoreFor(seq.length) !== score) fails.push(`k=${k}: scoreFor ${scoreFor(seq.length)} vs ${score}`); break; }
        if (res === 'correct') { score = seq.length; seq = extendSeq(seq, 6, r); break; }
      }
      round++;
    }
    const want = k === 0 ? 0 : START_LEN + k - 1;
    if (!ended || score !== want) fails.push(`k=${k}: score ${score}, expected ${want}, ended ${ended}`);
  }
  // playback timing: faster with length, never below the floor
  let prev = stepTiming(START_LEN);
  for (let len = START_LEN + 1; len <= 60; len++) {
    const t = stepTiming(len);
    if (t.on > prev.on || t.gap > prev.gap) fails.push(`timing grows at ${len}`);
    if (len <= START_LEN + 10 && t.on + t.gap >= prev.on + prev.gap) fails.push(`timing not faster at ${len}`);
    if (t.on < TIMING_FLOOR.on || t.gap < TIMING_FLOOR.gap) fails.push(`timing below floor at ${len}`);
    prev = t;
  }
  if (stepTiming(60).on !== TIMING_FLOOR.on || stepTiming(60).gap !== TIMING_FLOOR.gap) fails.push('timing floor not reached');
  // keyboard mapping
  const keys = [['1', 4, 0], ['4', 4, 3], ['5', 4, -1], ['6', 6, 5], ['9', 9, 8], ['0', 9, -1], ['a', 9, -1], ['12', 9, -1]];
  for (const [k, n, want] of keys) if (keyToPad(k, n) !== want) fails.push(`keyToPad(${k},${n})`);
  // strings
  for (const a of Object.keys(STR)) for (const b of Object.keys(STR)) for (const k of Object.keys(STR[a])) if (!(k in STR[b])) fails.push(`STR.${b}.${k} missing`);
  for (const l of Object.keys(STR)) {
    if (STR[l].rules.length < 4 || STR[l].rules.length > 6) fails.push(`STR.${l}.rules count`);
    if (STR[l].levels.length !== 3 || STR[l].levelInfos.length !== 3) fails.push(`STR.${l} levels`);
  }
  if (/[ěščřžýáíéůúťďňĚŠČŘŽÝÁÍÉŮÚŤĎŇ]/.test(JSON.stringify(STR.en) + STR.en.yourTurn(1, 2) + STR.en.wrong(3) + STR.en.summary(4) + STR.en.summary(0))) fails.push('Czech letter in English strings');
  return fails;
}
window.brainSelftest = brainSelftest;

$('pause-text').textContent = T.paused; $('pause-hint').textContent = T.resumeHint;
$('ov-again').textContent = T.again; $('startBtn').textContent = T.start;
$('board').setAttribute('aria-label', T.board);
$('soundBtn').title = T.sound; $('soundBtn').setAttribute('aria-label', T.sound); syncSound();
$('soundBtn').addEventListener('click', () => { sfx.set(!sfx.enabled); syncSound(); });
$('levels').setAttribute('aria-label', T.levelsAria);
bindHelp(T);
$('ov-again').addEventListener('click', () => newGame(S.level));
$('startBtn').addEventListener('click', start);
$('pause-tag').addEventListener('click', () => setPaused(false));
newGame(level);
if (params.has('selftest')) {
  const f = brainSelftest(); const el = $('selftest'); el.hidden = false;
  el.textContent = f.length ? 'SELFTEST FAIL: ' + f.join('; ') : 'SELFTEST PASS';
}
if (params.has('debug')) {
  window.brainGame = {
    state: () => ({ level: S.level, pads: S.pads, seq: S.seq.slice(), input: S.input.slice(), phase: S.phase, score: S.score,
                    best: S.best, finished: S.finished, paused: S.paused }),
    finish: ({ won = true } = {}) => finish({ won }),
    newGame: (lv) => newGame(lv),
  };
}
post({ type: 'kb-brain', event: 'ready', game: GAME_ID });
</script>
</body>
